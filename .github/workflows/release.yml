name: Publish to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false

      - name: Build packages
        run: |
          uv build --package llama-index-postprocessor-jev --no-sources
          uv build --package llama-index-selectors-jev --no-sources

      - name: Smoke test wheels
        run: |
          uv run --isolated --no-project \
            --with dist/llama_index_postprocessor_jev-*-py3-none-any.whl \
            python -c "from llama_index.postprocessor.jev import JevRerank"
          uv run --isolated --no-project \
            --with dist/llama_index_selectors_jev-*-py3-none-any.whl \
            python -c "from llama_index.selectors.jev import JevSingleSelector, JevMultiSelector"

      - name: Smoke test sdists
        run: |
          uv run --isolated --no-project \
            --with dist/llama_index_postprocessor_jev-*.tar.gz \
            python -c "from llama_index.postprocessor.jev import JevRerank"
          uv run --isolated --no-project \
            --with dist/llama_index_selectors_jev-*.tar.gz \
            python -c "from llama_index.selectors.jev import JevSingleSelector, JevMultiSelector"

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish-postprocessor:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-postprocessor
      url: https://pypi.org/project/llama-index-postprocessor-jev/
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false

      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish
        run: uv publish dist/llama_index_postprocessor_jev-*

  publish-selectors:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi-selectors
      url: https://pypi.org/project/llama-index-selectors-jev/
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false

      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish
        run: uv publish dist/llama_index_selectors_jev-*
