[project]
name = "llama-index-selectors-jev"
version = "0.1.1"
description = "Drop-in LlamaIndex selector powered by TypeSafe Jev (typed tool / query-engine choice)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<4.0"
authors = [{ name = "WiktorB2004" }]
keywords = [
    "llamaindex",
    "llama-index",
    "selector",
    "router",
    "rag",
    "typesafe",
    "jev",
    "query-engine",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "llama-index-core>=0.13.0,<0.15.0",
    "typesafe-sdk>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/WiktorB2004/llama-index-jev"
Repository = "https://github.com/WiktorB2004/llama-index-jev"
Issues = "https://github.com/WiktorB2004/llama-index-jev/issues"
Documentation = "https://github.com/WiktorB2004/llama-index-jev#readme"
Changelog = "https://github.com/WiktorB2004/llama-index-jev/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-mock"]

[tool.llamahub]
contains_example = true
import_path = "llama_index.selectors.jev"

[tool.llamahub.class_authors]
JevSingleSelector = "WiktorB2004"
JevMultiSelector = "WiktorB2004"

[tool.hatch.build.targets.sdist]
include = ["llama_index/", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["llama_index"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
